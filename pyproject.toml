[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-tools"
dynamic = ["version"]
description = "Open hydrology primitives: Rational method, SCS runoff, Manning hydraulics, HGL steps"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Flynn", email = "michaelbflynn@gmail.com" }]
keywords = ["hydrology", "stormwater", "rational-method", "manning", "scs", "hgl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hydro-tools = "hydro_tools.cli:main"

[project.urls]
Homepage = "https://github.com/mf4633/hydro-tools"
Documentation = "https://pe-calc.com/tools/rational-method.html"
Repository = "https://github.com/mf4633/hydro-tools"

[tool.setuptools]
package-dir = { "hydro_tools" = "." }
packages = ["hydro_tools"]

[tool.setuptools.dynamic]
version = { attr = "hydro_tools.__version__" }

[tool.setuptools.package-data]
hydro_tools = ["py.typed"]